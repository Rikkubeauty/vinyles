# Configuration Cloudflare Pages de la discothèque.
# Les secrets (DISCOGS_TOKEN, ADMIN_KEY) se règlent dans le tableau de bord Cloudflare, jamais ici.
name = "vinyles"
pages_build_output_dir = "."
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "vinyles"
# Sur un autre compte Cloudflare : remplacer par l'identifiant de votre base D1 (voir INSTALLATION.md).
database_id = "f3c37fda-9957-47ae-a0de-2a8bd89826f0"

[[r2_buckets]]
binding = "POCHETTES"
bucket_name = "vinyles-pochettes"
