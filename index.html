<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Discothèque d’Eduardo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: un mur de galerie clair. Les pochettes défilent en Cover Flow au centre, le fond prend la couleur de la pochette choisie. Ouvrir une pochette fait glisser le vinyle hors du carton. */
:root{
  --night:#0d0b0a;
  --fg:#f3ece0;
  --muted:#a69c8d;
  --line:rgba(243,236,224,.16);
  --amber:#f0a83a;
  --groove:#121111;
  --f-display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --f-body:"Newsreader",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --S:300px;
  --field:rgba(0,0,0,.35);--scrim:#0d0b0a;--panel:rgba(18,15,13,.92);--on-accent:#1b1206;--hover:rgba(255,255,255,.07);
  --amb:blur(7px) saturate(1.4) brightness(.55);--amb-op:1;--shadow:0 30px 60px rgba(0,0,0,.6);--shadow-lg:0 40px 80px rgba(0,0,0,.65);
  --dw:800;--ds:normal;--dt:none;--dx:100%;
  color-scheme:dark;
}
/* ===== Maquette 1 · Galerie : mur blanc de galerie, typo suisse large, rouge vif ===== */
:root[data-look="galerie"]{--night:#f1efea;--fg:#141414;--muted:#6d6a64;--line:rgba(20,20,20,.14);--amber:#e2231a;--on-accent:#fff;--groove:#151515;
  --field:rgba(255,255,255,.75);--scrim:#f1efea;--panel:rgba(250,249,246,.97);--hover:rgba(0,0,0,.05);
  --amb:blur(9px) saturate(1.3) brightness(1.15);--amb-op:.32;--shadow:0 26px 40px rgba(40,30,20,.28);--shadow-lg:0 36px 60px rgba(40,30,20,.3);
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;--f-body:"Archivo","Helvetica Neue",Arial,sans-serif;--f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --dw:900;--dx:118%;color-scheme:light}
:root[data-look="galerie"] h1{letter-spacing:-.045em;font-size:clamp(28px,4vw,44px)}
:root[data-look="galerie"] .caption .ct,:root[data-look="galerie"] .info h2{letter-spacing:-.045em}
:root[data-look="galerie"] .info .by,:root[data-look="galerie"] .caption .ca{font-style:normal;font-weight:500}
:root[data-look="galerie"] .sleeve{border-radius:0}

@media (max-width:640px){:root{--S:200px}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body.readonly #addBtn,body.readonly #newBlank,body.readonly #bulkDel,body.readonly .coll td:first-child,body.readonly .coll th:first-child,body.readonly .coll .acts2,body.readonly #edBtn,body.readonly #rmBtn,body.readonly #gotBtn,body.readonly #rmConf{display:none!important}
body:not(.readonly) #lockBtn{color:var(--amber);border-color:var(--amber)}
.lock{all:unset;cursor:pointer;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);background:var(--field)}
.lock:focus-visible{outline:2px solid var(--amber)}
.keydlg{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.35);display:grid;place-items:center;padding:16px}
.keybox{background:var(--night);color:var(--fg);border-radius:14px;padding:22px;width:min(400px,100%);display:grid;gap:12px;box-shadow:0 30px 60px rgba(0,0,0,.3)}
.keybox h2{margin:0;font-family:var(--f-display);font-weight:var(--dw);font-stretch:var(--dx);font-size:24px;letter-spacing:-.03em}
.keybox p{margin:0;color:var(--muted);font-size:15px}
.keybox input{font:inherit;font-size:16px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--field);color:var(--fg)}
.keybox input:focus{outline:2px solid var(--amber);border-color:transparent}
.keyacts{display:flex;gap:10px}
#dbStat{position:fixed;z-index:90;left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;padding:6px 11px 6px 9px;border-radius:999px;background:var(--bg,#f1efea);border:1px solid var(--line,#d9d5cc);font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;color:var(--muted);box-shadow:0 2px 10px rgba(0,0,0,.06)}
#dbStat i{width:9px;height:9px;border-radius:50%;background:#a9a59c;flex:none}
#dbStat.ok i{background:#1fa64a;box-shadow:0 0 0 3px rgba(31,166,74,.18)}
#dbStat.ko i{background:#e2231a;box-shadow:0 0 0 3px rgba(226,35,26,.18)}
#toast{position:fixed;z-index:95;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;transition:.25s;pointer-events:none;
  background:var(--fg);color:var(--night);font-family:var(--f-mono);font-size:13px;padding:10px 16px;border-radius:999px;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.err{background:var(--amber);color:var(--on-accent)}
html,body{min-height:100%}
body{background:var(--night);color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.5;overflow-x:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

/* fond ambiant : la pochette au centre, floutée en grand */
.ambient{position:fixed;inset:-10%;z-index:0;pointer-events:none}
.ambient div{position:absolute;left:0;top:0;width:10%;height:10%;background-size:cover;background-position:center;filter:var(--amb);opacity:0;transition:opacity 1.1s ease;transform:scale(10.4);transform-origin:0 0;will-change:opacity}
.ambient div.on{opacity:var(--amb-op)}
.ambient::after{content:"";position:absolute;inset:0;background:radial-gradient(70% 60% at 50% 40%,transparent,var(--night) 85%)}

.wrap{position:relative;z-index:1;max-width:1300px;margin:0 auto;padding-block:24px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px}
h1{font-family:var(--f-display);font-weight:var(--dw);font-style:var(--ds);text-transform:var(--dt);font-stretch:var(--dx);font-size:clamp(24px,3.4vw,36px);letter-spacing:-.02em;line-height:1;margin:0}
h1 span{color:var(--amber)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{font-family:var(--f-mono);font-size:13px;background:var(--field);border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:8px 14px;width:220px;max-width:100%}
.search:focus{outline:2px solid var(--amber);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:12px;letter-spacing:.05em;padding:6px 11px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chips button:hover{color:var(--fg)}
.chips button.on{background:var(--fg);color:var(--night);border-color:var(--fg)}
.chips button:focus-visible{outline:2px solid var(--amber)}
.status{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.status i{width:7px;height:7px;border-radius:50%;background:#5e554b;display:inline-block}
.status.on i{background:#7bd389;box-shadow:0 0 8px #7bd389}

/* ---------- Cover Flow ---------- */
.flow{position:relative;height:calc(var(--S) * 1.75);perspective:1100px;perspective-origin:50% 38%;overflow:hidden;outline:none;touch-action:pan-y;}
.lane{position:absolute;left:50%;top:calc(var(--S) * .12);width:0;height:0;transform-style:preserve-3d}
.cv{position:absolute;left:calc(var(--S) / -2);top:0;width:var(--S);height:var(--S);transform-style:preserve-3d;cursor:pointer;
  transition:transform .75s cubic-bezier(.2,.8,.2,1);will-change:transform;backface-visibility:hidden}
.cv .shade{position:absolute;left:0;right:0;top:0;height:calc(200% + 6px);background:var(--night);opacity:0;transition:opacity .75s;pointer-events:none;transform:translateZ(1px)}
.cv .refl{position:absolute;left:0;right:0;top:calc(100% + 6px);height:100%;background-size:cover;background-position:center;transform:scaleY(-1);opacity:.22;border-radius:3px;pointer-events:none;
  -webkit-mask-image:linear-gradient(to top,#000,transparent 40%);mask-image:linear-gradient(to top,#000,transparent 40%)}
.cv .tilt{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.2,1);will-change:transform}
.cv.center .tilt{transition:transform .18s ease-out}
.sleeve{position:absolute;inset:0;border-radius:3px;background-size:cover;background-position:center;overflow:hidden;
  box-shadow:var(--shadow),inset 0 0 0 1px var(--hover);}
.sleeve img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sleeve .tt{position:absolute;left:8%;right:8%;bottom:8%;font-family:var(--f-display);font-weight:var(--dw);font-style:var(--ds);text-transform:var(--dt);font-stretch:var(--dx);font-size:calc(var(--S) * .085);line-height:1.02;text-wrap:balance}
.sleeve .tt small{display:block;font-family:var(--f-mono);font-weight:400;font-size:calc(var(--S) * .037);letter-spacing:.08em;text-transform:uppercase;margin-bottom:.5em;opacity:.85}
.sleeve::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(60% 60% at var(--gx,30%) var(--gy,20%),rgba(255,255,255,.16),transparent 60%),linear-gradient(90deg,rgba(0,0,0,.14),transparent 6%,transparent 94%,rgba(0,0,0,.12))}
.vinyl{position:absolute;top:2%;left:2%;width:96%;height:96%;transform:translateZ(-2px);transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.disc{position:absolute;inset:0;border-radius:50%;will-change:transform;
  background:radial-gradient(circle,transparent 0 17%,var(--hover) 17.3%,transparent 18%),repeating-radial-gradient(circle,var(--groove) 0 1.2px,#1f1e1e 1.2px 1.9px);
  box-shadow:0 12px 30px rgba(0,0,0,.6)}
.vinyl::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;background:conic-gradient(from 30deg,transparent 0 25deg,rgba(255,255,255,.16) 40deg,transparent 58deg 205deg,rgba(255,255,255,.1) 222deg,transparent 240deg)}
.disc .lab{position:absolute;left:33%;top:33%;width:34%;height:34%;border-radius:50%;background-size:cover;background-position:center;box-shadow:0 0 0 2px rgba(0,0,0,.4)}
.disc .lab::after{content:"";position:absolute;left:50%;top:50%;width:8%;height:8%;margin:-4%;border-radius:50%;background:var(--night)}
.cv.center .tilt{transform:rotateY(var(--ry,0deg)) rotateX(var(--rx,0deg))}
.cv.center:hover .vinyl{transform:translateZ(-2px) translateX(34%) rotate(40deg)}
.cv:not(.center):hover .tilt{transform:rotateY(var(--hov,0deg)) translateZ(30px)}
.open{position:absolute;right:6%;top:6%;width:calc(var(--S) * .22);height:calc(var(--S) * .22);border-radius:50%;border:0;background:var(--amber);color:var(--on-accent);cursor:pointer;
  display:grid;place-items:center;font-family:var(--f-mono);font-size:calc(var(--S) * .036);letter-spacing:.06em;text-transform:uppercase;line-height:1.2;
  box-shadow:0 8px 20px rgba(0,0,0,.45);opacity:0;transform:translateZ(1px) scale(.6);transition:.35s;pointer-events:none}
.cv.center .open{opacity:1;transform:translateZ(1px) scale(1);pointer-events:auto}
.caption{text-align:center;display:grid;gap:3px;min-height:86px}
.caption .ct{font-family:var(--f-display);font-weight:var(--dw);font-style:var(--ds);text-transform:var(--dt);font-stretch:var(--dx);font-size:clamp(24px,3.4vw,38px);letter-spacing:-.02em;line-height:1.05;text-wrap:balance}
.caption .ca{font-style:italic;font-size:19px;color:var(--muted)}
.caption .cy{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;color:var(--amber);text-transform:uppercase}
.capline{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px}
.nav{all:unset;cursor:pointer;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:18px;background:var(--field)}
.nav:hover{border-color:var(--amber);color:var(--amber)}
.nav:focus-visible{outline:2px solid var(--amber)}
.scrub{width:100%;max-width:520px;margin:0 auto;display:block;accent-color:var(--amber)}
.empty{text-align:center;color:var(--muted);padding:80px 0}
/* ---------- Bascule et mode liste ---------- */
.shelftog{display:inline-flex;gap:4px}
.shelftog button{all:unset;cursor:pointer;font-family:var(--f-display);font-weight:800;font-stretch:var(--dx);font-size:17px;letter-spacing:-.02em;padding:4px 10px;border-radius:6px;color:var(--muted)}
.shelftog button[aria-pressed="true"]{color:var(--fg);box-shadow:inset 0 -3px 0 var(--amber)}
.shelftog button:focus-visible{outline:2px solid var(--amber)}
.shelftog small{font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--muted);margin-left:4px}
.subleft{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.dest{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dest label{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;text-transform:none;padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--fg)}
.dest input{position:absolute;opacity:0;pointer-events:none}
.dest label:has(input:checked){background:var(--fg);color:var(--night);border-color:var(--fg)}
.dest label:focus-within{outline:2px solid var(--amber)}
.subbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.viewtog{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--field)}
.viewtog button{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:12px;letter-spacing:.05em;padding:6px 13px;border-radius:999px;color:var(--muted)}
.viewtog button[aria-pressed="true"]{background:var(--fg);color:var(--night)}
.viewtog button:focus-visible{outline:2px solid var(--amber)}
.listbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.listbar .count{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-right:auto}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table.coll{width:100%;border-collapse:collapse;font-size:15px;min-width:760px}
.coll th{text-align:left;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.coll th button{all:unset;cursor:pointer}
.coll th button:focus-visible{outline:2px solid var(--amber)}
.coll th[aria-sort="ascending"] button::after{content:" ↑"}
.coll th[aria-sort="descending"] button::after{content:" ↓"}
.coll td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.coll tr:last-child td{border-bottom:0}
.coll tbody tr:hover{background:var(--hover)}
.coll tr.sel{background:var(--hover)}
.coll .thumb{width:46px;height:46px;border-radius:2px;background:#ccc center/cover;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.coll .tt{font-weight:600;cursor:pointer}
.coll .tt:hover{color:var(--amber)}
.coll .mono{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
.coll .acts2{white-space:nowrap;text-align:right}
.mini{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.04em;padding:6px 10px;border-radius:999px;border:1px solid var(--line)}
.mini:hover{border-color:var(--amber);color:var(--amber)}
.mini:focus-visible{outline:2px solid var(--amber)}
.mini.danger{color:var(--amber);border-color:var(--amber)}
.coll input[type=checkbox]{width:16px;height:16px;accent-color:var(--amber)}
.listempty{padding:50px 16px;text-align:center;color:var(--muted);display:grid;gap:14px;justify-items:center}
/* formulaire d'édition */
.edform{display:grid;gap:12px}
.edform .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.edform .two{grid-template-columns:1fr}}
.edform label{display:grid;gap:5px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-width:0}
.edform input,.edform textarea{font-family:var(--f-body);font-size:15px;letter-spacing:0;text-transform:none;background:var(--field);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
.edform textarea{min-height:90px;resize:vertical;line-height:1.45}
.edform textarea.mono{font-family:var(--f-mono);font-size:13px}
.edform input:focus,.edform textarea:focus{outline:2px solid var(--amber);border-color:transparent}
.edform small{font-family:var(--f-body);font-size:13px;letter-spacing:0;text-transform:none;color:var(--muted)}
.edcover{display:flex;gap:14px;align-items:center}
.edcover .thumb{width:96px;height:96px;flex:none;border-radius:3px;background:#ccc center/cover;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.edcover div{display:grid;gap:8px;flex:1;min-width:0}
.edfoot{display:flex;flex-wrap:wrap;gap:10px;padding-top:6px}

/* ---------- Vue détail ---------- */
.detail{position:fixed;inset:0;z-index:50;overflow-y:auto;background:var(--scrim);
  padding-block:max(28px,env(safe-area-inset-top,0px)) max(28px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.detail .in{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:start;min-height:100%}
@media (max-width:880px){.detail .in{grid-template-columns:minmax(0,1fr)}}
.close{all:unset;cursor:pointer;position:fixed;z-index:60;top:max(14px,env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:50%;background:var(--field);border:1px solid var(--line);display:grid;place-items:center;font-size:20px}
.close:focus-visible{outline:2px solid var(--amber)}
.pack{position:relative;width:min(380px,34vw);aspect-ratio:1;max-width:100%;margin:clamp(10px,4vw,40px) 0 0;perspective:1200px}
@media (max-width:880px){.pack{width:min(340px,52vw);margin-left:max(0px,calc(50% - min(340px,52vw) * .7))}}
.pack .tilt{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateY(var(--ry,0deg)) rotateX(var(--rx,0deg));transition:transform .3s ease-out}
.pack .sleeve{box-shadow:var(--shadow-lg)}
.pack .sleeve .tt{font-size:clamp(18px,2.8vw,32px)}
.pack .vinyl{transform:translateZ(-2px);transition:transform 1.1s cubic-bezier(.2,.8,.2,1)}
.pack.out .vinyl{transform:translateZ(-2px) translateX(40%)}
.pack.playing .disc{animation:rot 1.8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.info{min-width:0;padding-top:clamp(0px,3vw,30px)}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber)}
.info h2{font-family:var(--f-display);font-weight:var(--dw);font-style:var(--ds);text-transform:var(--dt);font-stretch:var(--dx);font-size:clamp(32px,5vw,60px);line-height:.98;letter-spacing:-.03em;margin:10px 0 6px;text-wrap:balance}
.info .by{font-size:clamp(20px,2.4vw,26px);font-style:italic;margin:0 0 22px;color:var(--fg)}
dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 18px;margin:0 0 22px;font-size:16px}
dt{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:4px;white-space:nowrap}
dd{margin:0}
.info h3{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:24px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
.anec{margin:0;padding:0;list-style:none;display:grid;gap:10px;font-size:17px}
.anec li{padding-left:16px;position:relative}
.anec li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--amber)}
.sides{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px 24px}
.side h4{font-family:var(--f-display);font-size:14px;margin:0 0 6px;font-weight:800;letter-spacing:.02em}
.side ol{margin:0;padding:0;list-style:none}
.tr{all:unset;box-sizing:border-box;display:flex;align-items:baseline;gap:10px;width:100%;padding:6px 8px;margin-left:-8px;border-radius:4px;cursor:pointer;font-size:16px;line-height:1.3}

<script>
/* En ligne (Cloudflare Pages), la page parle à /api : collection partagée, relais Discogs avec le jeton caché.
   Ouverte en fichier local, elle garde tout dans le navigateur et demande ton jeton Discogs. */
const cloud={on:false,key:null};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const viaRelais=location.protocol.startsWith("http");
const discogsToken=()=>viaRelais||cloud.on?"cloud":"";
const LABELS=[["#b0201c","#fff"],["#1f4e8c","#fff"],["#e9b84a","#222"],["#d9d2c2","#222"],["#2f6b4f","#fff"],["#6a2b6e","#fff"],["#1b1b1b","#eee"]];
const hash=s=>[...String(s)].reduce((h,c)=>(h*31+c.charCodeAt(0))|0,7)>>>0;
const demo=DISQUES.map(d=>({...d,source:"demo",tracks:d.pistes.map((t,i)=>({title:t,side:i<d.faceA?"A":"B"})),details:true}));
let records=demo;
const state={cur:null,track:-1,deezer:null,focus:0,decade:"all",q:"",list:[]};
const dz={};
/* ---------- Deezer (JSONP) ---------- */
function jsonp(url){
  return new Promise((res,rej)=>{
    const cb="dz_"+Math.random().toString(36).slice(2), s=document.createElement("script");
    const done=()=>{delete window[cb];s.remove();clearTimeout(t)};
    const t=setTimeout(()=>{done();rej(new Error("timeout"))},5000);
    window[cb]=d=>{done();d&&d.error?rej(d.error):res(d)};
    s.onerror=()=>{done();rej(new Error("blocked"))};
    s.src=url+(url.includes("?")?"&":"?")+"output=jsonp&callback="+cb;
    document.head.appendChild(s);
  });
}
/* Deezer : on ne garde un album que si l'artiste ET le titre correspondent vraiment au disque */
const normA=x=>String(x||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\b(the|les|le|la)\b/g,"").replace(/[^a-z0-9]/g,"");
const cleanT=x=>String(x||"").replace(/\s*[\(\[][^\)\]]*(remaster|deluxe|edition|édition|version|anniversary|mono|stereo|expanded|bonus)[^\)\]]*[\)\]]/gi,"").trim();
function artistOk(d,name){const a=normA(d.artiste.split(/,| & | et | feat/i)[0]),b=normA(name);return !!a&&!!b&&(a===b||a.includes(b)||b.includes(a))}
function titleOk(d,title){const a=normA(cleanT(d.titre)),b=normA(cleanT(title));return !!a&&!!b&&(a===b||(Math.min(a.length,b.length)/Math.max(a.length,b.length)>=.6&&(a.includes(b)||b.includes(a))))}
async function albumData(id){
  const a=await jsonp(`https://api.deezer.com/album/${id}`);
  return {albumId:a.id,cover:a.cover_xl,artist:a.artist&&a.artist.name,title:a.title,
    tracks:(a.tracks&&a.tracks.data||[]).map(t=>({title:t.title,preview:t.preview,duration:t.duration}))};
}
async function resolveDeezer(d){
  if(dz[d.id]!==undefined) return dz[d.id];
  try{
    let info=null;
    // 1. par code-barres (le plus fiable)
    const upc=String(d.ean||"").replace(/\D/g,"");
    if(upc.length>=8){ try{ const a=await albumData("upc:"+upc); if(a.albumId&&artistOk(d,a.artist)) info=a }catch(e){} }
    // 2. par artiste + titre, en vérifiant chaque résultat
    if(!info){
      const q=encodeURIComponent(`artist:"${d.artiste.split(/,| & /)[0]}" album:"${cleanT(d.titre)}"`);
      const s=await jsonp(`https://api.deezer.com/search/album?q=${q}&limit=15`);
      const hit=(s.data||[]).find(x=>artistOk(d,x.artist&&x.artist.name)&&normA(cleanT(x.title))===normA(cleanT(d.titre)))
             ||(s.data||[]).find(x=>artistOk(d,x.artist&&x.artist.name)&&titleOk(d,x.title));
      if(hit) info=await albumData(hit.id);
    }
    dz[d.id]=info; setStatus(true); return info;
  }catch(e){dz[d.id]=null;if(state.deezer===null)setStatus(false);return null}
}
function setStatus(ok){
  if(state.deezer===true) return; state.deezer=ok;
  $("#status").classList.toggle("on",ok);
  $("#status span").textContent=ok?"Deezer connecté":"Deezer injoignable ici, mode démo";
}
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\(.*?\)|\[.*?\]/g,"").replace(/[^a-z0-9]/g,"");
function previewFor(d,i){
  const info=dz[d.id]; if(!info) return null;
  const t=d.tracks[i], n=normA(cleanT(t.title)); if(!n) return null;
  const close=x=>!t.duration||!x.duration||Math.abs(t.duration-x.duration)<=20;
  return info.tracks.find(x=>normA(cleanT(x.title))===n&&close(x))

const DG="https://api.discogs.com";

async function dgFetch(path,token){

  const r=await fetch(url,{headers:{Accept:"application/vnd.discogs.v2.discogs+json"}});
  if(!r.ok){
    let info="";try{info=(await r.json()).erreur||""}catch(e){}
    if(r.status===401||r.status===403) throw new Error("Discogs refuse le jeton"+(cloud.on?" configuré sur Cloudflare":"")+(info?" ("+info+")":"")+".");
    if(r.status===404) throw new Error("Introuvable sur Discogs"+(info?" ("+info+")":"")+".");
    if(r.status===429) throw new Error("Discogs est saturé pour l'instant, réessaie dans quelques secondes."+(info?" ("+info+")":""));

}

const fmtDate=s=>{

  if(m[3]&&m[3]!=="00") return `${+m[3]===1?"1er":+m[3]} ${mois[+m[2]-1]} ${m[1]}`;
  if(m[2]&&m[2]!=="00") return `${mois[+m[2]-1]} ${m[1]}`; return m[1];
};
const stripDg=s=>String(s).replace(/\[(?:a|l|m|r)=?([^\]]*)\]/g,(_,x)=>/^\d+$/.test(x)?"":x).replace(/\[url=[^\]]*\](.*?)\[\/url\]/g,"$1").replace(/\[\/?[biu]\]/g,"");

  const all=[...(r.extraartists||[]),...(r.tracklist||[]).flatMap(t=>t.extraartists||[])];
  const who=re=>[...new Set(all.filter(a=>re.test(a.role)).map(a=>cleanName(a.anv||a.name)))];
  const comp=who(/written|compos|music by|lyrics|songwriter/i);
  const credits=[["Production",/^produc/i],["Ingénieur du son",/engineer|recorded by/i],["Mixage",/mixed by/i],["Arrangements",/arrang/i]]
    .map(([l,re])=>{const n=who(re);return n.length?`${l} : ${n.slice(0,4).join(", ")}`:null}).filter(Boolean);
  const places=[...new Set((r.companies||[]).filter(c=>/recorded at|mixed at|produced at|recorded/i.test(c.entity_type_name)).map(c=>cleanName(c.name)))];

function playTrack(i){
  const d=state.cur; if(!d||i<0||i>=d.tracks.length) return;
  const t=d.tracks[i], pv=previewFor(d,i); if(!pv||!pv.preview) return;
  const a=$("#audio"); a.pause();
  state.track=i; $("#pack").classList.add("out","playing"); highlight();
  const now=$("#now"), pa=$("#playAll"); if(pa){pa.innerHTML=ICON.pause;pa.setAttribute("aria-label","Pause");pa.title="Pause"}
  a.src=pv.preview;
  a.play().then(()=>{now&&(now.innerHTML=`Extrait 30 s · <b>${esc(t.title)}</b> · ${sideName(t.side)}`)}).catch(()=>{now&&(now.innerHTML=`Clique encore pour lancer le son · <b>${esc(t.title)}</b>`)});
}
function stopAudio(){
  const a=$("#audio"); a.pause(); a.removeAttribute("src");

/* ---------- Synchronisation avec Cloudflare ---------- */
let snap=new Map(), syncT=null, syncing=false;
const api=(path,opt={})=>fetch("/api"+path,{...opt,headers:{...(opt.headers||{}),"x-cle":cloud.key||""}});
function scheduleSync(){clearTimeout(syncT);syncT=setTimeout(syncNow,350)}
async function dataUrlToBlob(u){return (await fetch(u)).blob()}
async function syncNow(){
  if(syncing){scheduleSync();return} syncing=true;
  try{
    if(!cloud.key&&!(await askKey())){toast("Modifications gardées sur cet appareil seulement : entre la clé d'édition pour les enregistrer en ligne.");return}
    const ids=new Set(mine.map(d=>d.id)); let n=0;
    for(const d of mine){
      if(d.cover&&d.cover.startsWith("data:")){
        const b=await dataUrlToBlob(d.cover);
        const r=await api("/pochettes",{method:"POST",headers:{"content-type":b.type||"image/jpeg"},body:b});
        if(!r.ok) throw new Error((await r.json().catch(()=>({}))).erreur||"Envoi de la pochette impossible.");
        d.cover=(await r.json()).url; store.set(KEY,mine);
      }
      const j=JSON.stringify(d); if(snap.get(d.id)===j) continue;
      const r=await api("/disques/"+encodeURIComponent(d.id),{method:"PUT",headers:{"content-type":"application/json"},body:j});
      if(r.status===401){cloud.key=null;store.del("cle");throw new Error("Clé d'édition refusée.")}
      if(!r.ok) throw new Error((await r.json().catch(()=>({}))).erreur||"Enregistrement impossible.");
      snap.set(d.id,j); n++;
    }
    for(const id of [...snap.keys()]) if(!ids.has(id)){
      const r=await api("/disques/"+encodeURIComponent(id),{method:"DELETE"});
      if(r.ok){snap.delete(id);n++}
    }
    if(n){toast("Enregistré en ligne ✓");dbStatus("ok",`Base connectée · ${mine.length} disque${mine.length>1?"s":""}`)}
  }catch(err){toast(err.message==="Failed to fetch"?"Pas de connexion : réessaie dans un instant.":err.message,true);if(err.message==="Failed to fetch")dbStatus("ko","Base injoignable");else checkDb()}
  finally{syncing=false}
}
function dbStatus(state,txt){const el=$("#dbStat");if(!el)return;el.className=state;el.querySelector("span").textContent=txt}
async function checkDb(){
  if(!location.protocol.startsWith("http")){dbStatus("ko","Base : hors ligne (fichier local)");return null}
  try{const r=await fetch("/api/disques",{cache:"no-store"});
    if(r.ok&&(r.headers.get("content-type")||"").includes("json")){const l=await r.json();dbStatus("ok",`Base connectée · ${l.length} disque${l.length>1?"s":""}`);return l}
    let info="";try{info=(await r.json()).erreur||""}catch(e){}
    dbStatus("ko",`Base déconnectée (${r.status}${info?" : "+info:""})`);
  }catch(e){dbStatus("ko","Base injoignable")}
  return null;
}
function toast(msg,err){
  let t=$("#toast"); if(!t){t=document.createElement("div");t.id="toast";t.setAttribute("role","status");document.body.appendChild(t)}

}

    cover:(r.images&&r.images[0]&&r.images[0].uri)||null,genres:[...(r.genres||[]),...(r.styles||[])].join(", "),
    pays:r.country||"",ean:((r.identifiers||[]).find(x=>/barcode/i.test(x.type))||{}).value||"",

/* recherche : titre / artiste, ou EAN / code-barres. Les suggestions arrivent pendant la frappe. */
const srch={q:"",page:1,pages:1,items:[],seq:0};
async function searchDiscogs(q,page){
  const token=discogsToken();
  if(!token) throw new Error("La recherche Discogs marche seulement depuis ton site.");
  const digits=q.replace(/[\s-]/g,"");
  const path=/^\d{8,14}$/.test(digits)
    ?`/database/search?barcode=${digits}&type=release&per_page=30&page=${page}`
    :`/database/search?q=${encodeURIComponent(q)}&type=release&format=Vinyl&per_page=30&page=${page}`;
  return dgFetch(path,token);
}
function renderResults(list){
  $("#results").innerHTML=list.map(r=>{
    const [art,...rest]=String(r.title).split(" - "), tit=rest.join(" - ")||art;
    const meta=[r.year,r.country,(r.label||[])[0],r.catno].filter(Boolean).map(esc).join(" · ");
    const cov=r.cover_image&&!/spacer\.gif/.test(r.cover_image)?r.cover_image:r.thumb;
    return `<button class="res${mine.some(d=>d.discogsId===r.id)?" added":""}" type="button" data-id="${r.id}">
      <span class="rc" style="${cov?`background-image:url('${esc(cov)}')`:""}"></span>
      <span><b>${esc(tit)}</b><br>${esc(rest.length?art:"")}</span><small>${meta}${(r.format||[]).length?"<br>"+esc(r.format.slice(0,3).join(", ")):""}</small></button>`}).join("");
}
async function runSearch(q,more){
  const my=++srch.seq;
  if(!more){srch.q=q;srch.page=1;srch.items=[]}else srch.page++;
  $("#aMsg").className="imsg"; $("#aMsg").textContent=more?"Chargement…":"Recherche sur Discogs…";
  try{
    const j=await searchDiscogs(srch.q,srch.page); if(my!==srch.seq) return;
    srch.pages=(j.pagination&&j.pagination.pages)||1;
    srch.items=srch.items.concat(j.results||[]); renderResults(rank(srch.q,srch.items));
    $("#aMsg").textContent=srch.items.length?`Les plus proches de « ${srch.q} » en premier. Clique sur ton pressage pour l'ajouter.`:"Aucun résultat. Essaie avec moins de mots, ou le numéro de catalogue.";
    $("#moreBtn").hidden=srch.page>=srch.pages;
  }catch(err){if(my!==srch.seq)return;$("#aMsg").className="imsg err";$("#aMsg").textContent=niceErr(err);$("#moreBtn").hidden=true}
}
/* Discogs cherche aussi dans les crédits et les morceaux : on garde d'abord ce qui correspond au titre ou à l'artiste */
const fold=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\(\d+\)/g," ").replace(/[^a-z0-9]+/g," ").trim();
function rank(q,items){
  const digits=q.replace(/[\s-]/g,""); if(/^\d{8,14}$/.test(digits)) return items;
  const toks=fold(q).split(" ").filter(t=>t.length>1);
  const seen=new Set(), out=[];
  for(const r of items){
    const key=[fold(r.title),r.year,r.country,r.catno].join("|"); if(seen.has(key)) continue; seen.add(key);
    const hay=" "+fold(r.title)+" ", words=hay.trim().split(" ");
    const hit=toks.filter(t=>hay.includes(" "+t)||words.some(w=>w.length>3&&t.length>3&&lev(w,t)<=1)).length;
    const [art,...rest]=String(r.title).split(" - ");
    const exact=toks.length&&(fold(rest.join(" "))===fold(q)||fold(art)===fold(q))?2:0;
    out.push({r,score:(toks.length?hit/toks.length:0)*10+exact+Math.log10(1+((r.community||{}).have||0))});
  }
  const good=out.filter(x=>x.score>=toks.length&&x.score>=8||x.score>=10);
  return (good.length?good:out).sort((a,b)=>b.score-a.score).map(x=>x.r);
}
function lev(a,b){if(Math.abs(a.length-b.length)>1)return 2;const m=[...Array(a.length+1)].map((_,i)=>[i]);for(let j=1;j<=b.length;j++)m[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}

  if(t.dataset.sel){t.checked?lst.sel.add(t.dataset.sel):lst.sel.delete(t.dataset.sel); lst.confirm=null; renderList(); return}
  const ed=t.closest("[data-edit]"); if(ed){openEditor(byId(ed.dataset.edit)); return}
  const del=t.closest("[data-del]"); if(del){const id=del.dataset.del; if(lst.confirm===id){lst.confirm=null; lst.sel.delete(id); removeRecord(byId(id)); renderList()} else {lst.confirm=id; renderList()} return}
  const op=t.closest("[data-open]"); if(op){openDetail(byId(op.dataset.open))}
});
$("#bulkDel").addEventListener("click",()=>{
  if(lst.confirm!=="bulk"){lst.confirm="bulk";renderList();return}
  mine=mine.filter(d=>!lst.sel.has(d.id)); lst.sel.clear(); lst.confirm=null; saveMine(); rebuild(); renderList();
});

/* ---------- Édition d'un disque ---------- */
let editing=null;
const tracksToText=d=>(d.tracks||[]).map(t=>[t.pos||t.side,t.title,t.duration?fmt(t.duration):""].join(" | ").replace(/ \| $/,"")).join("\n");
function textToTracks(txt){
  return txt.split("\n").map(l=>l.trim()).filter(Boolean).map((l,i)=>{
    const p=l.split("|").map(x=>x.trim()); let pos="",title=l,dur="";
    if(p.length>=2){pos=p[0];title=p[1];dur=p[2]||""}
    const m=/^([A-Z])/i.exec(pos), [mm,ss]=dur.split(":");
    return {pos,title,side:m?m[1].toUpperCase():"A",duration:dur&&ss!==undefined?(+mm*60+ +ss)||0:0};
  });
}
function openEditor(d){
  const blank=!d;
  editing=d||{id:"m"+Date.now().toString(36),source:"manuel",titre:"",artiste:"",annee:null,sortie:"",label:"",cat:"",cover:null,genres:"",pays:"",ean:"",lieu:"",compositeurs:"",credits:"",anecdotes:[],tracks:[],details:true,anecdotesFr:true,
    sleeve:{bg:"linear-gradient(135deg,#d9d4ca,#a9a195)",ink:"#141414"},labelColor:"#e2231a",labelInk:"#fff",ajoute:new Date().toISOString().slice(0,10)};
  $("#edTitle").textContent=blank?"Nouveau disque":"Modifier le disque";
  const f=(id,label,val,type="text",extra="")=>`<label for="${id}">${label}<input id="${id}" type="${type}" value="${esc(val??"")}" ${extra}></label>`;
  const e=editing;
  $("#edForm").innerHTML=`
    <div class="edcover"><span class="thumb" id="edThumb" style="${e.cover?`background-image:url('${esc(e.cover)}')`:`background:${e.sleeve.bg}`}"></span>
      <div><label for="edCover">Pochette (adresse de l'image)<input id="edCover" type="url" value="${esc(e.cover&&!e.cover.startsWith("data:")?e.cover:"")}" placeholder="https://…"></label>
      <label class="btn" for="edFile" style="justify-self:start">Choisir une photo<input id="edFile" type="file" accept="image/*" hidden></label></div></div>
    <div class="dest" role="radiogroup" aria-label="Étagère">Étagère <label><input type="radio" name="edStat" value="collection" ${isWish(e)?"":"checked"}>Ma collection</label><label><input type="radio" name="edStat" value="souhait" ${isWish(e)?"checked":""}>Mes souhaits</label></div>
    ${f("edT","Titre",e.titre,"text","required")}
    ${f("edA","Artiste",e.artiste,"text","required")}
    <div class="two">${f("edY","Année",e.annee||"","number",'min="1900" max="2100"')}${f("edS","Date de sortie",e.sortie)}</div>
    <div class="two">${f("edL","Label",e.label)}${f("edC","Référence catalogue",e.cat)}</div>
    <div class="two">${f("edE","EAN / code-barres",e.ean)}${f("edP","Pays",e.pays)}</div>
    ${f("edG","Genre",e.genres)}
    ${f("edLi","Lieu d'enregistrement",e.lieu)}
    ${f("edCo","Compositeurs",e.compositeurs)}
    ${f("edCr","Crédits",e.credits)}
    <label for="edN">Anecdotes et notes <small>une par ligne</small><textarea id="edN">${esc((e.anecdotes||[]).join("\n"))}</textarea></label>
    <label for="edTr">Morceaux <small>une ligne par morceau : A1 | Titre | 4:18</small><textarea id="edTr" class="mono" rows="8">${esc(tracksToText(e))}</textarea></label>
    <div class="edfoot"><button class="btn pri" type="submit">Enregistrer</button><button class="btn" type="button" id="edCancel">Annuler</button>
      ${blank?"":`<button class="btn" type="button" id="edDel" style="margin-left:auto">Supprimer ce disque</button>`}</div>
    <div class="imsg" id="edMsg" role="status"></div>`;
  $("#editor").hidden=false; $("#edT").focus();
  $("#edCover").addEventListener("input",ev=>{const v=ev.target.value.trim();if(v){editing._cover=v;$("#edThumb").style.cssText=`background-image:url('${v.replace(/'/g,"%27")}')`}});
  $("#edFile").addEventListener("change",async ev=>{const file=ev.target.files[0];if(!file)return;
    try{editing._cover=await shrink(file);$("#edThumb").style.cssText=`background-image:url('${editing._cover}')`;$("#edCover").value=""}catch(err){$("#edMsg").className="imsg err";$("#edMsg").textContent="Impossible de lire cette image."}});
  $("#edCancel").addEventListener("click",closeEditor);
  const del=$("#edDel"); if(del) del.addEventListener("click",()=>{if(del.dataset.sure){removeRecord(editing);closeEditor();renderList()}else{del.dataset.sure="1";del.textContent="Confirmer la suppression"}});
}
function shrink(file){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const m=600,k=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);res(c.toDataURL("image/jpeg",.85))};img.onerror=rej;img.src=URL.createObjectURL(file)})}
function closeEditor(){$("#editor").hidden=true;editing=null}
$("#edClose").addEventListener("click",closeEditor);
addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#editor").hidden)closeEditor()});
$("#edForm").addEventListener("submit",ev=>{
  ev.preventDefault(); const e=editing, v=id=>$("#"+id).value.trim();
  e.titre=v("edT"); e.artiste=v("edA"); e.annee=v("edY")?+v("edY"):null; e.sortie=v("edS")||(e.annee?String(e.annee):"");
  e.label=v("edL"); e.cat=v("edC"); e.ean=v("edE"); e.pays=v("edP"); e.genres=v("edG"); e.lieu=v("edLi"); e.compositeurs=v("edCo"); e.credits=v("edCr");
  e.anecdotes=$("#edN").value.split("\n").map(x=>x.trim()).filter(Boolean); e.anecdotesFr=true;
  e.tracks=textToTracks($("#edTr").value);
  if((document.querySelector("input[name=edStat]:checked")||{}).value==="souhait") e.statut="souhait"; else delete e.statut;
  if(e._cover!==undefined){e.cover=e._cover||null;delete e._cover}
  const i=mine.findIndex(x=>x.id===e.id); if(i>=0) mine[i]=e; else mine.unshift(e);
  delete dz[e.id]; saveMine(); closeEditor(); rebuild(e.id);
  if(state.cur&&state.cur.id===e.id&&!$("#detail").hidden){paintPack(e);renderInfo(e)}
});
$("#newBlank").addEventListener("click",()=>{openEditor(null);if(shelf==="souhaits")document.querySelector("input[name=edStat][value=souhait]").checked=true});

/* ---------- Traduction des notes Discogs (souvent en anglais) ---------- */
const EN=/\b(the|and|with|was|were|recorded|released|this|from|by|on|of|is|in|at|for|album|sleeve|track|tracks|side|issue|pressing)\b/gi;
const FR=/\b(le|la|les|des|du|et|avec|est|une|pour|dans|sur|par|enregistr|pochette)\b/gi;
const looksEnglish=t=>((t.match(EN)||[]).length>=2)&&((t.match(EN)||[]).length>(t.match(FR)||[]).length*2);
async function toFr(t){
  if(!looksEnglish(t)) return t;
  const parts=t.match(/[^.!?]+[.!?]*\s*/g)||[t], chunks=[]; let cur="";
  for(const p of parts){ if((cur+p).length>450&&cur){chunks.push(cur);cur=""} cur+=p } if(cur) chunks.push(cur);
  const out=[];
  for(const c of chunks){
    const r=await fetch("https://api.mymemory.translated.net/get?langpair=en|fr&q="+encodeURIComponent(c.slice(0,480)));
    const j=await r.json(), tr=j&&j.responseData&&j.responseData.translatedText;
    if(j.responseStatus!=200||!tr||/MYMEMORY WARNING|QUERY LENGTH/i.test(tr)) return t;
    out.push(tr.replace(/&#39;/g,"'").replace(/&quot;/g,'"').replace(/&amp;/g,"&"));
  }
  return out.join(" ").replace(/\s+/g," ").trim();
}
async function translateRecord(d){
  if(d.anecdotesFr||!d.anecdotes||!d.anecdotes.length) return;
  try{ d.anecdotes=await Promise.all(d.anecdotes.map(toFr)); d.anecdotesFr=true; saveMine(); }catch(e){}
}

(async()=>{
  // en ligne : la collection vient de Cloudflare
  const list=await checkDb();
  if(list){
    cloud.on=true; cloud.key=store.get("cle");
    const local=mine; mine=list; snap=new Map(list.map(d=>[d.id,JSON.stringify(d)]));
    store.set(KEY,mine); setEditable(!!cloud.key); $("#lockBtn").hidden=false;
    const extra=local.filter(d=>!snap.has(d.id));
    if(extra.length){mine=mine.concat(extra);toast(`${extra.length} disque${extra.length>1?"s":""} de cet appareil à envoyer en ligne…`);scheduleSync()}
  }
  setInterval(()=>{if(!document.hidden)checkDb()},120000);
  addEventListener("online",checkDb); addEventListener("offline",()=>dbStatus("ko","Pas de connexion internet"));
  // sur ton site, collection.json (à côté de index.html) sert de point de départ
  if(!mine.length){try{const r=await fetch("collection.json",{cache:"no-store"}); if(r.ok){const j=await r.json(); const l=Array.isArray(j)?j:j.disques; if(Array.isArray(l)&&l.length){mine=l;saveMine()}}}catch(e){}}
  rebuild();
  if(store.get("vue")==="list") setView("list");
  if(shelf==="souhaits") setShelf("souhaits");
  for(const d of records.slice(0,12)){await resolveDeezer(d);applyCover(d)}
})();
